<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metal Scroll | 金屬卷軸 — 活動月曆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #eef0f7;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(67, 56, 202, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 18%, rgba(30, 58, 138, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, rgba(238, 240, 247, 0.92) 0%, rgba(244, 241, 234, 0.95) 100%);
            color: #1e2538;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(55, 48, 163, 0.18);
        }
        #mobileWeekStrip {
            touch-action: pan-y;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- 頂部品牌與中英文切換 -->
        <header class="glass-panel rounded-2xl p-5 sm:p-6 mb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="inline-flex items-center gap-2 text-[11px] font-semibold tracking-widest uppercase text-indigo-800 bg-indigo-100/80 px-2.5 py-0.5 rounded-full mb-1.5">
                    <span>LIVE GIG CALENDAR</span>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wide text-indigo-950">
                    The Metal Scroll <span class="text-indigo-700/50 mx-1">|</span> <span class="text-indigo-900">金屬卷軸</span>
                </h1>
                <p id="subtitleText" class="text-xs sm:text-sm text-slate-600 mt-1">台灣金屬／搖滾演出情報行事曆</p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-between md:justify-end">
                <!-- 中英文切換按鈕 -->
                <div class="inline-flex rounded-xl bg-indigo-950/10 p-1" role="group">
                    <button type="button" id="langZhBtn" onclick="setLang('zh')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-900 text-white transition cursor-pointer">
                        中文
                    </button>
                    <button type="button" id="langEnBtn" onclick="setLang('en')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-950 hover:bg-white/60 transition cursor-pointer">
                        English
                    </button>
                </div>

                <a id="submitLinkBtn" href="https://themetalscrolltw.github.io/metal-scroll-calendar/submit.html"
                    class="bg-indigo-900 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap">
                    + 投稿活動情報
                </a>
            </div>
        </header>

        <!-- 控制列：月份／日期導覽與縣市篩選 -->
        <section class="glass-panel rounded-2xl p-4 sm:p-5 mb-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button type="button" onclick="navigatePrev()" class="px-3 py-1.5 rounded-xl bg-indigo-900/10 hover:bg-indigo-900/20 text-indigo-950 text-xs font-bold cursor-pointer">&larr;</button>
                <h2 id="currentPeriodLabel" class="text-base sm:text-lg font-bold text-indigo-950 min-w-[130px] text-center"></h2>
                <button type="button" onclick="navigateNext()" class="px-3 py-1.5 rounded-xl bg-indigo-900/10 hover:bg-indigo-900/20 text-indigo-950 text-xs font-bold cursor-pointer">&rarr;</button>
                <button type="button" id="todayBtn" onclick="goToday()" class="ml-1 px-3 py-1.5 rounded-xl border border-indigo-900/20 hover:bg-indigo-50 text-indigo-950 text-xs font-semibold cursor-pointer">
                    今天
                </button>
            </div>

            <div class="flex items-center gap-2">
                <select id="countyFilter" onchange="renderView()" class="px-3 py-1.5 rounded-xl border border-indigo-900/20 bg-white text-xs sm:text-sm text-indigo-950 font-medium">
                    <option value="ALL">全部縣市</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="新竹市">新竹市</option>
                    <option value="台中市">台中市</option>
                    <option value="台南市">台南市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="屏東縣">屏東縣</option>
                    <option value="宜蘭縣">宜蘭縣</option>
                    <option value="花蓮縣">花蓮縣</option>
                    <option value="台東縣">台東縣</option>
                </select>
            </div>
        </section>

        <!-- 手機版：可左右滑動的週日期列 + 單日活動明細 -->
        <section class="md:hidden space-y-4">
            <div id="mobileWeekStrip" class="glass-panel rounded-2xl p-4 select-none">
                <div class="flex items-center justify-between mb-2">
                    <span id="swipeHintText" class="text-[11px] text-slate-500">👈 左右滑動切換上／下一週，點選日期查看當日活動</span>
                    <button type="button" id="showWholeWeekBtn" onclick="selectWholeWeek()" class="text-[11px] font-bold text-indigo-800 underline cursor-pointer">
                        顯示整週
                    </button>
                </div>
                <div id="mobileWeekDays" class="grid grid-cols-7 gap-1.5 text-center"></div>
            </div>

            <div class="glass-panel rounded-2xl p-4">
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-indigo-900/10">
                    <h3 id="mobileSelectedDayTitle" class="text-sm font-bold text-indigo-950"></h3>
                    <span id="mobileDayCount" class="text-xs font-semibold text-indigo-800 bg-indigo-100 px-2 py-0.5 rounded-full"></span>
                </div>
                <div id="mobileDayEvents" class="space-y-3"></div>
            </div>
        </section>

        <!-- 電腦版：完整月曆網格 -->
        <section class="hidden md:block glass-panel rounded-2xl p-5">
            <div id="desktopWeekHeaders" class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-600 pb-3 border-b border-indigo-900/10"></div>
            <div id="desktopMonthGrid" class="grid grid-cols-7 gap-2 pt-3"></div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = 'https://ybbwdtndrnnvfkeiclji.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K7iIa_1ztydOrYUrO465DA_nqwN_K_6';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let lang = 'zh';
        let publishedEvents = [];
        let anchorDate = new Date();
        let selectedDateStr = toDateStr(new Date());
        let mobileShowWholeWeek = false;

        const I18N = {
            zh: {
                subtitle: '台灣金屬／搖滾演出情報行事曆',
                submitBtn: '+ 投稿活動情報',
                today: '今天',
                allCounties: '全部縣市',
                swipeHint: '👈 左右滑動切換上／下一週，點選日期查看當日活動',
                showWholeWeek: '顯示整週',
                wholeWeekTitle: '本週全部演出活動',
                noEventsDay: '這天目前沒有已登錄的演出活動',
                noEventsWeek: '本週目前沒有已登錄的演出活動',
                timeTbd: '時間未定',
                weekdays: ['日', '一', '二', '三', '四', '五', '六'],
                counties: {
                    '台北市': '台北市', '新北市': '新北市', '桃園市': '桃園市', '新竹市': '新竹市',
                    '台中市': '台中市', '台南市': '台南市', '高雄市': '高雄市', '屏東縣': '屏東縣',
                    '宜蘭縣': '宜蘭縣', '花蓮縣': '花蓮縣', '台東縣': '台東縣', '其他': '其他'
                }
            },
            en: {
                subtitle: 'Taiwan Metal & Rock Live Gig Calendar',
                submitBtn: '+ Submit Event',
                today: 'Today',
                allCounties: 'All Cities',
                swipeHint: '👈 Swipe left/right for prev/next week, tap a day for gigs',
                showWholeWeek: 'Whole Week',
                wholeWeekTitle: 'All Gigs This Week',
                noEventsDay: 'No scheduled gigs on this date.',
                noEventsWeek: 'No scheduled gigs this week.',
                timeTbd: 'Time TBD',
                weekdays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                counties: {
                    '台北市': 'Taipei', '新北市': 'New Taipei', '桃園市': 'Taoyuan', '新竹市': 'Hsinchu',
                    '台中市': 'Taichung', '台南市': 'Tainan', '高雄市': 'Kaohsiung', '屏東縣': 'Pingtung',
                    '宜蘭縣': 'Yilan', '花蓮縣': 'Hualien', '台東縣': 'Taitung', '其他': 'Other'
                }
            }
        };

        function toDateStr(d) {
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function cleanLineupText(raw) {
            return String(raw || '')
                .replace(/\[TBD_START_TIME\]/g, '')
                .replace(/\[TBD_END_TIME\]/g, '')
                .replace(/\[END_TIME:\d{2}:\d{2}\]/g, '')
                .replace(/尚未確定/g, '')
                .trim();
        }

        function setLang(newLang) {
            lang = newLang;
            const zhBtn = document.getElementById('langZhBtn');
            const enBtn = document.getElementById('langEnBtn');
            if (lang === 'zh') {
                zhBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-900 text-white transition cursor-pointer';
                enBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-950 hover:bg-white/60 transition cursor-pointer';
            } else {
                enBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-900 text-white transition cursor-pointer';
                zhBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-950 hover:bg-white/60 transition cursor-pointer';
            }
            applyStaticTranslations();
            renderView();
        }

        function applyStaticTranslations() {
            const t = I18N[lang];
            document.getElementById('subtitleText').textContent = t.subtitle;
            document.getElementById('submitLinkBtn').textContent = t.submitBtn;
            document.getElementById('todayBtn').textContent = t.today;
            document.getElementById('swipeHintText').textContent = t.swipeHint;
            document.getElementById('showWholeWeekBtn').textContent = t.showWholeWeek;

            const filterEl = document.getElementById('countyFilter');
            Array.from(filterEl.options).forEach(opt => {
                if (opt.value === 'ALL') {
                    opt.textContent = t.allCounties;
                } else if (t.counties[opt.value]) {
                    opt.textContent = t.counties[opt.value];
                }
            });
        }

        function getFilteredEvents() {
            const selectedCounty = document.getElementById('countyFilter').value;
            return publishedEvents.filter(ev => {
                if (selectedCounty === 'ALL') return true;
                return ev.mp_venues && ev.mp_venues.county === selectedCounty;
            });
        }

        function eventsOnDate(dateStr, list) {
            return list.filter(ev => {
                const startStr = ev.start_date ? String(ev.start_date).slice(0, 10) : '';
                const endStr = ev.end_date ? String(ev.end_date).slice(0, 10) : startStr;
                return dateStr >= startStr && dateStr <= endStr;
            });
        }

        function formatEventTime(ev) {
            const rawLineup = String(ev.lineup || '');
            if (rawLineup.includes('[TBD_START_TIME]')) {
                return I18N[lang].timeTbd;
            }
            const iso = String(ev.start_date || '');
            return iso.length >= 16 ? iso.slice(11, 16) : '';
        }

        function formatVenue(ev) {
            if (!ev.mp_venues) return '';
            const c = ev.mp_venues.county || '';
            const countyLabel = I18N[lang].counties[c] || c;
            return (countyLabel ? countyLabel + ' · ' : '') + (ev.mp_venues.name || '');
        }

        function getWeekStart(d) {
            const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            copy.setDate(copy.getDate() - copy.getDay());
            return copy;
        }

        function navigatePrev() {
            if (window.innerWidth < 768) {
                anchorDate.setDate(anchorDate.getDate() - 7);
                selectedDateStr = toDateStr(anchorDate);
                mobileShowWholeWeek = false;
            } else {
                anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() - 1, 1);
            }
            renderView();
        }

        function navigateNext() {
            if (window.innerWidth < 768) {
                anchorDate.setDate(anchorDate.getDate() + 7);
                selectedDateStr = toDateStr(anchorDate);
                mobileShowWholeWeek = false;
            } else {
                anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + 1, 1);
            }
            renderView();
        }

        function goToday() {
            anchorDate = new Date();
            selectedDateStr = toDateStr(anchorDate);
            mobileShowWholeWeek = false;
            renderView();
        }

        function selectMobileDay(dateStr) {
            selectedDateStr = dateStr;
            mobileShowWholeWeek = false;
            renderView();
        }

        function selectWholeWeek() {
            mobileShowWholeWeek = true;
            renderView();
        }

        function renderView() {
            const t = I18N[lang];
            const filtered = getFilteredEvents();
            const year = anchorDate.getFullYear();
            const month = anchorDate.getMonth();

            if (lang === 'zh') {
                document.getElementById('currentPeriodLabel').textContent = year + ' 年 ' + (month + 1) + ' 月';
            } else {
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                document.getElementById('currentPeriodLabel').textContent = monthNames[month] + ' ' + year;
            }

            // 1. 渲染電腦版月曆
            const weekHeadersEl = document.getElementById('desktopWeekHeaders');
            weekHeadersEl.innerHTML = t.weekdays.map(w => '<div>' + w + '</div>').join('');

            const monthGridEl = document.getElementById('desktopMonthGrid');
            monthGridEl.innerHTML = '';

            const firstDayOfMonth = new Date(year, month, 1);
            const startOffset = firstDayOfMonth.getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = toDateStr(new Date());

            for (let i = 0; i < startOffset; i++) {
                monthGridEl.innerHTML += '<div class="min-h-[105px] rounded-xl bg-slate-100/50"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dObj = new Date(year, month, day);
                const dStr = toDateStr(dObj);
                const dayEvents = eventsOnDate(dStr, filtered);
                const isToday = dStr === todayStr;

                const eventsHtml = dayEvents.map(ev =>
                    '<div class="p-1.5 rounded-lg bg-indigo-900/10 border-l-2 border-indigo-800 text-[11px] leading-snug">' +
                        '<div class="font-bold text-indigo-950 truncate">' + escapeHtml(ev.title) + '</div>' +
                        '<div class="text-slate-600 truncate">' + escapeHtml(formatEventTime(ev) + ' ' + formatVenue(ev)) + '</div>' +
                    '</div>'
                ).join('');

                monthGridEl.innerHTML +=
                    '<div class="min-h-[110px] p-2 rounded-xl border ' + (isToday ? 'border-indigo-700 bg-indigo-50/60' : 'border-indigo-900/10 bg-white/80') + ' flex flex-col gap-1">' +
                        '<div class="text-xs font-bold ' + (isToday ? 'text-indigo-800' : 'text-slate-600') + '">' + day + '</div>' +
                        eventsHtml +
                    '</div>';
            }

            // 2. 渲染手機版週日期列與單日活動明細
            const weekStart = getWeekStart(anchorDate);
            const mobileWeekDaysEl = document.getElementById('mobileWeekDays');
            mobileWeekDaysEl.innerHTML = '';
            const weekDates = [];

            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
                const dStr = toDateStr(d);
                weekDates.push(dStr);
                const count = eventsOnDate(dStr, filtered).length;
                const isSelected = !mobileShowWholeWeek && dStr === selectedDateStr;
                const isToday = dStr === todayStr;

                mobileWeekDaysEl.innerHTML +=
                    '<button type="button" onclick="selectMobileDay(\'' + dStr + '\')" ' +
                        'class="py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition cursor-pointer ' +
                        (isSelected ? 'bg-indigo-900 text-white shadow-sm' : (isToday ? 'bg-indigo-100 text-indigo-950' : 'bg-white/70 text-slate-700')) + '">' +
                        '<span class="text-[10px] opacity-80">' + t.weekdays[i] + '</span>' +
                        '<span class="text-sm font-bold">' + d.getDate() + '</span>' +
                        '<span class="w-1.5 h-1.5 rounded-full ' + (count > 0 ? (isSelected ? 'bg-amber-300' : 'bg-indigo-700') : 'bg-transparent') + '"></span>' +
                    '</button>';
            }

            const titleEl = document.getElementById('mobileSelectedDayTitle');
            const countEl = document.getElementById('mobileDayCount');
            const listEl = document.getElementById('mobileDayEvents');

            let targetEvents = [];
            if (mobileShowWholeWeek) {
                titleEl.textContent = t.wholeWeekTitle;
                targetEvents = filtered.filter(ev => {
                    const s = String(ev.start_date || '').slice(0, 10);
                    return weekDates.includes(s);
                });
            } else {
                titleEl.textContent = selectedDateStr;
                targetEvents = eventsOnDate(selectedDateStr, filtered);
            }

            countEl.textContent = targetEvents.length + (lang === 'zh' ? ' 場活動' : ' gigs');

            if (targetEvents.length === 0) {
                listEl.innerHTML = '<p class="text-center py-6 text-xs text-slate-500">' +
                    (mobileShowWholeWeek ? t.noEventsWeek : t.noEventsDay) + '</p>';
            } else {
                listEl.innerHTML = targetEvents.map(ev =>
                    '<div class="p-3.5 rounded-xl border border-indigo-900/15 bg-white shadow-sm space-y-1">' +
                        '<div class="flex items-center justify-between gap-2">' +
                            '<span class="text-[11px] font-bold text-indigo-800 bg-indigo-100/80 px-2 py-0.5 rounded-md">' +
                                escapeHtml((mobileShowWholeWeek ? String(ev.start_date).slice(5, 10) + ' ' : '') + formatEventTime(ev)) +
                            '</span>' +
                            '<span class="text-[11px] text-slate-600 font-medium">' + escapeHtml(formatVenue(ev)) + '</span>' +
                        '</div>' +
                        '<h4 class="text-sm font-bold text-indigo-950">' + escapeHtml(ev.title) + '</h4>' +
                        '<p class="text-xs text-slate-600 whitespace-pre-line">' + escapeHtml(cleanLineupText(ev.lineup)) + '</p>' +
                    '</div>'
                ).join('');
            }
        }

        // 手機版左右滑動切換上／下一週手勢
        let touchStartX = 0;
        const weekStrip = document.getElementById('mobileWeekStrip');
        weekStrip.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        weekStrip.addEventListener('touchend', function(e) {
            const diffX = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diffX) > 45) {
                if (diffX < 0) {
                    navigateNext(); // 往左滑：下一週
                } else {
                    navigatePrev(); // 往右滑：上一週
                }
            }
        }, { passive: true });

        async function loadPublishedEvents() {
            const { data, error } = await supabaseClient
                .from('mp_events')
                .select('*, mp_venues(name, county)')
                .eq('status', 'published')
                .order('start_date', { ascending: true });

            if (!error && data) {
                publishedEvents = data;
            }
            applyStaticTranslations();
            renderView();
        }

        loadPublishedEvents();
    </script>
</body>
</html>
