<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metal Scroll | 金屬卷軸 — 活動投稿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #eef0f7;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(67, 56, 202, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 18%, rgba(30, 58, 138, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, rgba(238, 240, 247, 0.92) 0%, rgba(244, 241, 234, 0.95) 100%);
            color: #1e2538;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(55, 48, 163, 0.18);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="glass-panel rounded-2xl p-6 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <div class="inline-flex items-center gap-2 text-[11px] font-semibold tracking-widest uppercase text-indigo-800 bg-indigo-100/80 px-2.5 py-0.5 rounded-full mb-1.5">
                    <span>EVENT SUBMISSION</span>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-indigo-950">
                    The Metal Scroll <span class="text-indigo-700/50 mx-1">|</span> <span class="text-indigo-900">金屬卷軸</span>
                </h1>
                <p class="text-sm text-slate-600 mt-1">活動投稿表單</p>
            </div>
            <a href="https://themetalscrolltw.github.io/metal-scroll-calendar/" class="text-xs font-semibold bg-indigo-900/10 hover:bg-indigo-900/20 text-indigo-950 px-3.5 py-2 rounded-xl transition whitespace-nowrap">
                &larr; 返回活動月曆
            </a>
        </header>

        <form id="submitForm" class="glass-panel rounded-2xl p-6 space-y-5">
            <div>
                <label class="block text-sm font-bold text-indigo-950 mb-1.5">活動名稱 <span class="text-rose-600">*</span></label>
                <input type="text" id="title" required placeholder="請輸入活動名稱"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
            </div>

            <div>
                <label class="block text-sm font-bold text-indigo-950 mb-1.5">演出陣容 <span class="text-rose-600">*</span></label>
                <textarea id="lineup" rows="3" required placeholder="請輸入演出陣容"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-indigo-950 mb-1.5">縣市 <span class="text-rose-600">*</span></label>
                    <select id="county" required class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                        <option value="台北市">台北市</option>
                        <option value="新北市">新北市</option>
                        <option value="桃園市">桃園市</option>
                        <option value="新竹市">新竹市</option>
                        <option value="台中市">台中市</option>
                        <option value="台南市">台南市</option>
                        <option value="高雄市">高雄市</option>
                        <option value="屏東縣">屏東縣</option>
                        <option value="宜蘭縣">宜蘭縣</option>
                        <option value="花蓮縣">花蓮縣</option>
                        <option value="台東縣">台東縣</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-indigo-950 mb-1.5">演出場地 <span class="text-rose-600">*</span></label>
                    <input type="text" id="venueName" required placeholder="請輸入演出場地"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-indigo-950 mb-1.5">開始日期 <span class="text-rose-600">*</span></label>
                    <input type="date" id="startDate" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-sm font-bold text-indigo-950">開始時間</label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
                            <input type="checkbox" id="tbdStartTime" class="rounded text-indigo-800">
                            <span>尚未確定</span>
                        </label>
                    </div>
                    <input type="time" id="startTime"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-indigo-950 mb-1.5">結束日期</label>
                    <input type="date" id="endDate"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-sm font-bold text-indigo-950">結束時間</label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
                            <input type="checkbox" id="tbdEndTime" class="rounded text-indigo-800">
                            <span>尚未確定</span>
                        </label>
                    </div>
                    <input type="time" id="endTime"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-indigo-950 mb-1.5">活動連結（選填）</label>
                <input type="url" id="sourceUrl" placeholder="https://..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
            </div>

            <div class="pt-3 border-t border-indigo-900/15 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-indigo-950 mb-1.5">投稿人是誰（主辦／樂團名稱） <span class="text-rose-600">*</span></label>
                        <input type="text" id="submitterName" required placeholder="請輸入主辦或樂團名稱"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-indigo-950 mb-1.5">社群官方 IG <span class="text-rose-600">*</span></label>
                        <input type="text" id="submitterSocial" required placeholder="@..."
                            class="w-full px-3.5 py-2.5 rounded-xl border border-indigo-900/20 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700 text-sm">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 rounded-xl bg-indigo-900 hover:bg-indigo-800 text-white font-bold text-sm transition cursor-pointer shadow-sm">
                送出投稿
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ybbwdtndrnnvfkeiclji.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K7iIa_1ztydOrYUrO465DA_nqwN_K_6';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tbdStartEl = document.getElementById('tbdStartTime');
        const startTimeEl = document.getElementById('startTime');
        const tbdEndEl = document.getElementById('tbdEndTime');
        const endTimeEl = document.getElementById('endTime');

        tbdStartEl.addEventListener('change', function() {
            startTimeEl.disabled = this.checked;
            startTimeEl.classList.toggle('bg-slate-100', this.checked);
            startTimeEl.classList.toggle('text-slate-400', this.checked);
        });

        tbdEndEl.addEventListener('change', function() {
            endTimeEl.disabled = this.checked;
            endTimeEl.classList.toggle('bg-slate-100', this.checked);
            endTimeEl.classList.toggle('text-slate-400', this.checked);
        });

        document.getElementById('submitForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '送出中...';

            try {
                const title = document.getElementById('title').value.trim();
                let lineup = document.getElementById('lineup').value.trim();
                const county = document.getElementById('county').value;
                const venueName = document.getElementById('venueName').value.trim();
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value || startDate;
                const sourceUrl = document.getElementById('sourceUrl').value.trim();
                const submitterName = document.getElementById('submitterName').value.trim();
                const submitterSocial = document.getElementById('submitterSocial').value.trim();

                let timePart = '00:00:00';
                if (tbdStartEl.checked) {
                    lineup += ' [TBD_START_TIME]';
                } else if (startTimeEl.value) {
                    timePart = startTimeEl.value + ':00';
                }

                if (tbdEndEl.checked) {
                    lineup += ' [TBD_END_TIME]';
                } else if (endTimeEl.value) {
                    lineup += ' [END_TIME:' + endTimeEl.value + ']';
                }

                let venueId = null;
                const { data: existingVenues } = await supabaseClient
                    .from('mp_venues')
                    .select('id')
                    .eq('name', venueName)
                    .eq('county', county)
                    .limit(1);

                if (existingVenues && existingVenues.length > 0) {
                    venueId = existingVenues[0].id;
                } else {
                    const { data: newVenue, error: venueErr } = await supabaseClient
                        .from('mp_venues')
                        .insert([{ name: venueName, county: county }])
                        .select('id')
                        .single();
                    if (venueErr) throw venueErr;
                    venueId = newVenue.id;
                }

                const startIso = startDate + 'T' + timePart + '+08:00';
                const { data: newEvent, error: eventErr } = await supabaseClient
                    .from('mp_events')
                    .insert([{
                        title: title,
                        lineup: lineup,
                        start_date: startIso,
                        end_date: endDate,
                        venue_id: venueId,
                        status: 'pending',
                        submitter_name: submitterName,
                        submitter_social: submitterSocial
                    }])
                    .select('id')
                    .single();

                if (eventErr) throw eventErr;

                if (sourceUrl && newEvent && newEvent.id) {
                    await supabaseClient
                        .from('mp_event_sources')
                        .insert([{ event_id: newEvent.id, source_url: sourceUrl }]);
                }

                alert('投稿成功！');
                document.getElementById('submitForm').reset();
                startTimeEl.disabled = false;
                startTimeEl.classList.remove('bg-slate-100', 'text-slate-400');
                endTimeEl.disabled = false;
                endTimeEl.classList.remove('bg-slate-100', 'text-slate-400');
            } catch (err) {
                alert('送出失敗：' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.textContent = '送出投稿';
            }
        });
    </script>
</body>
</html>
