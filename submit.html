<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metal Scroll | 金屬卷軸 — 主辦活動自主投稿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #eef0f7;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(67, 56, 202, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 18%, rgba(30, 58, 138, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, rgba(238, 240, 247, 0.92) 0%, rgba(244, 241, 234, 0.95) 100%);
            color: #1e2538;
        }

        .scroll-card {
            position: relative;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.90) 0%, rgba(224, 231, 255, 0.45) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 48, 163, 0.2);
            box-shadow: 0 16px 40px -18px rgba(30, 41, 59, 0.24);
        }

        .scroll-card::before,
        .scroll-card::after {
            content: "";
            position: absolute;
            top: 22px;
            bottom: 22px;
            width: 5px;
            border-radius: 999px;
            background: linear-gradient(
                180deg,
                rgba(55, 48, 163, 0.45) 0%,
                rgba(180, 172, 154, 0.55) 50%,
                rgba(55, 48, 163, 0.45) 100%
            );
            pointer-events: none;
        }

        .scroll-card::before { left: 10px; }
        .scroll-card::after { right: 10px; }

        .form-input {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(67, 56, 202, 0.2);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            background: #ffffff;
            border-color: #3730a3;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.14);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="scroll-card w-full max-w-2xl rounded-2xl p-6 sm:p-10">
        <!-- 頂部品牌標題與返回月曆按鈕 -->
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 pb-6 mb-6 border-b border-indigo-900/15">
            <div>
                <div class="inline-flex items-center gap-2 text-[11px] font-semibold tracking-widest uppercase text-indigo-800/85 bg-indigo-100/75 px-2.5 py-0.5 rounded-full mb-2">
                    <span>EVENT SUBMISSION</span>
                    <span>•</span>
                    <span>ORGANIZER PORTAL</span>
                </div>
                <h1 class="text-2xl sm:text-[26px] font-bold tracking-wide text-indigo-950">
                    The Metal Scroll <span class="text-indigo-700/45 mx-1">|</span> <span class="text-indigo-900">The Metal Scroll | 金屬卷軸</span>
                </h1>
                <p class="text-sm text-slate-600 mt-1">金屬音樂活動主辦自主投稿表單</p>
            </div>

            <a href="./index.html" class="self-start inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-900 bg-white/80 hover:bg-indigo-900/10 border border-indigo-900/20 px-3 py-2 rounded-xl transition shrink-0">
                <span>&larr;</span>
                <span>返回活動月曆</span>
            </a>
        </div>

        <!-- 投稿表單 -->
        <form id="submitForm" class="space-y-5">
            <div>
                <label for="title" class="block text-sm font-bold text-indigo-950 mb-1.5">
                    活動名稱 <span class="text-indigo-600">*</span>
                </label>
                <input type="text" id="title" required placeholder="例：大港開唱" class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400">
            </div>

            <div>
                <label for="lineup" class="block text-sm font-bold text-indigo-950 mb-1.5">
                    演出陣容 (樂團名稱) <span class="text-indigo-600">*</span>
                </label>
                <input type="text" id="lineup" required placeholder="例：血肉果汁機, 閃靈" class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400">
                <p class="text-[11px] text-slate-500 mt-1">多個樂團請以逗號（,）分隔，月曆將自動轉為樂團標籤顯示。</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="start_date" class="block text-sm font-bold text-indigo-950 mb-1.5">
                        開始日期與時間 <span class="text-indigo-600">*</span>
                    </label>
                    <input type="datetime-local" id="start_date" required class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-bold text-indigo-950 mb-1.5">
                        結束日期 <span class="text-xs font-normal text-slate-500">(*若表演只有一天則不用填)</span>
                    </label>
                    <input type="date" id="end_date" class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="county" class="block text-sm font-bold text-indigo-950 mb-1.5">
                        城市 <span class="text-indigo-600">*</span>
                    </label>
                    <input type="text" id="county" required placeholder="例：台北市" class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400">
                </div>
                <div>
                    <label for="venue" class="block text-sm font-bold text-indigo-950 mb-1.5">
                        場地名稱 <span class="text-indigo-600">*</span>
                    </label>
                    <input type="text" id="venue" required placeholder="例：Legacy Taipei" class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400">
                </div>
            </div>

            <div>
                <label for="source_url" class="block text-sm font-bold text-indigo-950 mb-1.5">
                    售票連結
                </label>
                <input type="url" id="source_url" placeholder="https://..." class="form-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400">
            </div>

            <div id="statusMessage" class="hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 active:bg-indigo-950 text-white font-bold text-sm py-3.5 rounded-xl shadow-md shadow-indigo-950/20 transition cursor-pointer">
                立即送出活動（等待後台審核）
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ybbwdtndrnnvfkeiclji.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K7iIa_1ztydOrYUrO465DA_nqwN_K_6';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('submitForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(text, isError) {
            statusMessage.textContent = text;
            statusMessage.className = 'rounded-xl px-4 py-3 text-sm font-medium ' + (
                isError
                    ? 'bg-rose-50 text-rose-800 border border-rose-200'
                    : 'bg-indigo-50 text-indigo-950 border border-indigo-200'
            );
            statusMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = '資料傳送中...';
            statusMessage.classList.add('hidden');

            const title = document.getElementById('title').value.trim();
            const lineup = document.getElementById('lineup').value.trim();
            const startDate = document.getElementById('start_date').value;
            const endDate = document.getElementById('end_date').value || null;
            const county = document.getElementById('county').value.trim();
            const venueName = document.getElementById('venue').value.trim();
            const sourceUrl = document.getElementById('source_url').value.trim();

            try {
                // 1. 查詢或建立場地
                let venueId = null;
                const { data: existingVenues, error: venueSearchErr } = await supabaseClient
                    .from('mp_venues')
                    .select('id')
                    .eq('name', venueName)
                    .eq('county', county)
                    .limit(1);

                if (venueSearchErr) throw venueSearchErr;

                if (existingVenues && existingVenues.length > 0) {
                    venueId = existingVenues[0].id;
                } else {
                    const { data: newVenue, error: venueInsertErr } = await supabaseClient
                        .from('mp_venues')
                        .insert([{ name: venueName, county: county }])
                        .select('id')
                        .single();

                    if (venueInsertErr) throw venueInsertErr;
                    venueId = newVenue.id;
                }

                // 2. 新增待審核活動
                const { data: newEvent, error: eventInsertErr } = await supabaseClient
                    .from('mp_events')
                    .insert([{
                        title: title,
                        lineup: lineup,
                        start_date: startDate,
                        end_date: endDate,
                        venue_id: venueId,
                        status: 'pending'
                    }])
                    .select('id')
                    .single();

                if (eventInsertErr) throw eventInsertErr;

                // 3. 若有填寫售票或活動連結則寫入來源表
                if (sourceUrl && newEvent && newEvent.id) {
                    const { error: sourceInsertErr } = await supabaseClient
                        .from('mp_event_sources')
                        .insert([{
                            event_id: newEvent.id,
                            source_url: sourceUrl
                        }]);

                    if (sourceInsertErr) throw sourceInsertErr;
                }

                showStatus('投稿已成功送出！活動將在後台審核通過後顯示於月曆上。', false);
                form.reset();
            } catch (err) {
                console.error('送出失敗:', err);
                showStatus('送出失敗，請稍後再試或檢查欄位格式：' + (err.message || err), true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '立即送出活動（等待後台審核）';
            }
        });
    </script>
</body>
</html>
